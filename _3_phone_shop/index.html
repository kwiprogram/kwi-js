<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header class="header">
        <div class="logo">
            <div class="logo-icon">
                <i class="fa-solid fa-code"></i>
            </div>
            <h3 class="logo-name">kwi</h3>
        </div>
        <div class="bar">
            <i class="fa-solid fa-bars"></i>
        </div>
    </header>

    <main class="container">
        <aside class="category-sidebar">
            <ul class="categories-button">
               <li><button type="button" class="button">iPhone</button></li> 
            </ul>
        </aside>
        <div class="item-container">
            <div class="card">
                <div class="image">
                    <img src="https://files.refurbed.com/ii/iphone-13-pro-max-1647243805.jpg?t=fitdesign&h=600&w=800" alt="">
                </div>
                <div class="title">
                    <p>iPhone 13 Pro Max</p>
                </div>
            </div>
        </div>
    </main>


    <footer class="footer">
        <div class="contact-link">
            <h4>Contact:</h4>
            <ul class="contact">
               <li><a href="https://t.me/ornbona">@kwi - telegram</a></li>
               <li><a href="https://kwi-portfolio.vercel.app">@kwi - portfolio</a></li>
            </ul> 
        </div>
        <div class="copy-right">
            <p>&copf; copy right - kwi 2026</p>
        </div>
    </footer>

    <script type="module" src="main.js">

    </script>
</body>
</html>
