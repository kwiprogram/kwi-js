<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All data (JS)</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0);
            font-family: sans-serif;
            padding: 20px;
        }
        .container{
            width: 100%;
            height: 100vh;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            justify-content: center;
            align-items: center;
            gap: 30px;
        }
        .card{
            padding: 2rem 3.5rem;
            border-radius: 1rem;
            background-image: linear-gradient(
                to bottom,
                rgba(99, 99, 53, 0.8),
                rgba(75, 75, 0, 0.5),
                rgba(40, 40, 21, 0.8)
            );
            border: 1px solid gold;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;    
            gap: 8px;
        }
        .card h3{
            font-size: 3rem;
            color: gold;
        }
        .card p, .card span{
            font-size: 22px;
            color: white;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h3>Kwi</h3>
            <p>20 years old</p>
            <span>kwi@gmail.com</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
