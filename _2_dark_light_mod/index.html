<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark/Light mod</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .container{
            width: 100%;
            height: 100vh;
            background-color: white;
            padding: 30px;
        }
        .btn{
            display: flex;
            justify-content: end;
        }
        .btn > .btnToggle{
            padding: 20px 40px;
            background-color: skyblue;
            font-size: 2rem;
            border: none;
            font-weight: bold;
            border-radius: 10px;
        }
        .btn > .btnToggle:hover{
            cursor: pointer;
            background-color: rgb(122, 206, 239);
        }
        .btn > .btnToggle:active{
            box-shadow: 0 5px 10px gray;
        }

        .paragraph{
            text-align: center;
            font-size: 3rem;
            font-family: sans-serif;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="btn">
            <button class="btnToggle">Dark mod</button>
        </div>
        <p class="paragraph">New generation!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
